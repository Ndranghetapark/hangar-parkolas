<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hangár parkolási rend</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 0;
  }
  #container {
    position: relative;
    width: 100%;
    max-width: 1400px;
    margin: auto;
  }
  #hangarImg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* A kattintható pont – nincs szöveg, csak glow */
  .spot {
    position: absolute;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
    pointer-events: auto;
  }
  /* Szabad: zöld fényudvar */
  .spot.free {
    box-shadow: 0 0 14px 5px rgba(0, 255, 0, 0.9);
  }
  /* Foglalt: piros fényudvar */
  .spot.occupied {
    box-shadow: 0 0 14px 5px rgba(255, 0, 0, 0.9);
  }

  #loginBox {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.2);
    display: none;
    z-index: 1000;
  }
  #topBar {
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #editStatus {
    font-weight: bold;
    color: #555;
  }
  #saveBtn[disabled] {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div id="loginBox">
  <h3>Belépés szerkesztési módba</h3>
  <input id="user" placeholder="Felhasználónév" /><br><br>
  <input id="pass" placeholder="Jelszó" type="password" /><br><br>
  <button onclick="login()">Belépés</button>
  <button onclick="closeLogin()">Mégse</button>
</div>

<div id="topBar">
  <button onclick="openLogin()">Szerkesztési mód</button>
  <button id="saveBtn" onclick="saveState()" disabled>💾 Mentés</button>
  <span id="editStatus">Néző mód</span>
</div>

<div id="container">
  <img id="hangarImg" src="hangar.png" alt="Hangár parkolási rend" />
</div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 🔧 Firebase config – a te projektedhez
const firebaseConfig = {
  apiKey: "AIzaSyD83Ad3v0ZsI1QaqjzXvg4X-we1GP3NAcM",
  authDomain: "hangar-parkolas.firebaseapp.com",
  databaseURL: "https://hangar-parkolas-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hangar-parkolas",
  storageBucket: "hangar-parkolas.firebasestorage.app",
  messagingSenderId: "975134849760",
  appId: "1:975134849760:web:77e05ea356e7b9e295ee85"
};

// Firebase init
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---- APP LOGIKA ----
let editMode = false;
const spots = {};       // id -> DOM elem
const spotStates = {};  // id -> 'free' | 'occupied'

/*
  Fix parkolóhelyek – csak INNEN jönnek a pozíciók.
  Ezeket tudod kézzel finomhangolni.
*/
const baseSpots = [
  {n:1,x:88,y:65},
  {n:2,x:88,y:73},
  {n:3,x:85,y:82},
  {n:4,x:78,y:87},
  {n:5,x:61,y:87},
  {n:6,x:55,y:87},
  {n:7,x:50,y:87},
  {n:8,x:45,y:87},
  {n:9,x:39,y:87},
  {n:10,x:34,y:87},

  // alsó sor finomítva
  {n:11,x:30,y:86},
  {n:12,x:25,y:86},

  // bal oldal
  {n:13,x:18,y:72},
  {n:14,x:18,y:66},
  {n:15,x:18,y:60},
  {n:16,x:18,y:54},
  {n:17,x:18,y:48},
  {n:18,x:18,y:42},
  {n:19,x:18,y:36},
  {n:20,x:18,y:30},
  {n:21,x:18,y:24},

  // felső sor
  {n:22,x:26,y:17},
  {n:23,x:32,y:17},
  {n:24,x:38,y:17},
  {n:25,x:44,y:17},
  {n:26,x:50,y:17},
  {n:27,x:56,y:17},
  {n:28,x:62,y:17},
  {n:29,x:68,y:17},
  {n:30,x:74,y:17},
  {n:31,x:80,y:17},
  {n:32,x:86,y:17},

  // jobb oldal
  {n:33,x:88,y:32},
  {n:34,x:88,y:38},

  // extra – ha kell
  {n:101,x:90,y:60}
];

/* Csak a kinézetet frissíti (zöld/piros glow) */
function updateSpotVisual(id) {
  const el = spots[id];
  if (!el) return;
  const state = spotStates[id] || 'free';
  el.classList.toggle('free', state === 'free');
  el.classList.toggle('occupied', state === 'occupied');
}

/* Új spot DOM létrehozása megadott pozícióra */
function createSpot(id, xPercent, yPercent) {
  const container = document.getElementById('container');

  if (spots[id]) {
    const el = spots[id];
    el.style.left = xPercent + '%';
    el.style.top = yPercent + '%';
    updateSpotVisual(id);
    return;
  }

  const d = document.createElement('div');
  d.className = 'spot free';
  d.style.left = xPercent + '%';
  d.style.top = yPercent + '%';

  spots[id] = d;
  // alapállapot: szabad, amíg a Firebase mást nem mond
  if (!spotStates[id]) spotStates[id] = 'free';
  updateSpotVisual(id);

  d.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleLocalState(id);
  });

  container.appendChild(d);
}

/* Foglalt / szabad váltása – CSAK HELYBEN, mentés nélkül */
function toggleLocalState(id) {
  if (!editMode) return;
  const current = spotStates[id] || 'free';
  spotStates[id] = current === 'free' ? 'occupied' : 'free';
  updateSpotVisual(id);
}

/* Mentés gomb – az ÖSSZES aktuális állapot felmegy Firebase-be */
function saveState() {
  if (!editMode) {
    alert('Menteni csak szerkesztési módban lehet.');
    return;
  }
  const states = {};
  for (const id in spots) {
    states[id] = spotStates[id] || 'free';
  }

  db.ref('spots').set(states)
    .then(() => {
      alert('Mentés sikeres. Az aktuális állapot elmentve a szerverre.');
    })
    .catch(err => {
      console.error(err);
      alert('Hiba történt a mentés közben.');
    });
}

/* Kezdéskor: összes buborék felrakása, majd Firebase-ből állapot betöltése + figyelés */
function init() {
  // buborékok létrehozása a fix pozíciókból
  baseSpots.forEach(s => {
    const id = String(s.n);
    createSpot(id, s.x, s.y);
  });

  // Firebase-ből foglaltsági állapot betöltése / figyelése
  db.ref('spots').on('value', snapshot => {
    const data = snapshot.val() || {};
    for (const id in spots) {
      if (data[id] === 'free' || data[id] === 'occupied') {
        spotStates[id] = data[id];
      } else {
        spotStates[id] = 'free';
      }
      updateSpotVisual(id);
    }
  });
}

/* Login */
function openLogin() {
  document.getElementById('loginBox').style.display = 'block';
}
function closeLogin() {
  document.getElementById('loginBox').style.display = 'none';
}
function login() {
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;
  if (u === 'parkrend' && p === 'peramefőnök') {
    editMode = true;
    document.getElementById('editStatus').textContent =
      'Szerkesztési mód (foglaltság állítható + mentés engedélyezve)';
    document.getElementById('saveBtn').disabled = false;
    alert('Szerkesztési mód engedélyezve');
  } else {
    alert('Hibás adatok');
  }
  closeLogin();
}

// Indítás
init();
</script>
</body>
</html>
