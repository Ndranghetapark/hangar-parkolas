<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hangár parkolási rend – RealTime</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    margin: 0;
    padding: 0;
  }

  #container {
    position: relative;
    width: 100%;
    max-width: 1400px;
    margin: auto;
    margin-top: 20px;
  }

  #hangarImg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Glow spotok – NINCS szám, csak fényudvar */
  .spot {
    position: absolute;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
  }

  .free {
    box-shadow: 0 0 14px 5px rgba(0, 255, 0, 0.9);
  }

  .occupied {
    box-shadow: 0 0 14px 5px rgba(255, 0, 0, 0.9);
  }

  #loginBox {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.3);
    display: none;
    z-index: 1000;
  }

  #topBar {
    padding: 8px 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #editStatus {
    font-weight: bold;
    color: #444;
  }
</style>
</head>
<body>

<!-- LOGIN BOX -->
<div id="loginBox">
  <h3>Belépés szerkesztési módba</h3>
  <input id="user" placeholder="Felhasználónév"><br><br>
  <input id="pass" type="password" placeholder="Jelszó"><br><br>
  <button onclick="login()">Belép</button>
  <button onclick="closeLogin()">Mégse</button>
</div>

<!-- FELSŐ SÁV -->
<div id="topBar">
  <button onclick="openLogin()">Szerkesztési mód</button>
  <span id="editStatus">Néző mód</span>
</div>

<!-- KÉP ÉS GLOW PONTOK -->
<div id="container">
  <img id="hangarImg" src="hangar.png">
</div>

<!-- FIREBASE SCRIPT -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// --- FIREBASE KONFIG (A TE ÉLES ADATAIDDAL) ---
const firebaseConfig = {
  apiKey: "AIzaSyD83Ad3v0ZsI1QaqjzXvg4X-we1GP3NAcM",
  authDomain: "hangar-parkolas.firebaseapp.com",
  databaseURL: "https://hangar-parkolas-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hangar-parkolas",
  storageBucket: "hangar-parkolas.firebasestorage.app",
  messagingSenderId: "975134849760",
  appId: "1:975134849760:web:77e05ea356e7b9e295ee85"
};

// Firebase init
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Szerkesztési mód
let editMode = false;

// Alap pozíciók – ezek maradnak, mert szépen beállítottad
const baseSpots = [
  {n:1,x:88,y:65},{n:2,x:88,y:73},{n:3,x:85,y:82},{n:4,x:78,y:87},
  {n:5,x:61,y:87},{n:6,x:55,y:87},{n:7,x:50,y:87},{n:8,x:45,y:87},
  {n:9,x:39,y:87},{n:10,x:34,y:87},{n:11,x:30,y:86},{n:12,x:25,y:86},
  {n:13,x:18,y:72},{n:14,x:18,y:66},{n:15,x:18,y:60},{n:16,x:18,y:54},
  {n:17,x:18,y:48},{n:18,x:18,y:42},{n:19,x:18,y:36},{n:20,x:18,y:30},
  {n:21,x:18,y:24},{n:22,x:26,y:17},{n:23,x:32,y:17},{n:24,x:38,y:17},
  {n:25,x:44,y:17},{n:26,x:50,y:17},{n:27,x:56,y:17},{n:28,x:62,y:17},
  {n:29,x:68,y:17},{n:30,x:74,y:17},{n:31,x:80,y:17},{n:32,x:86,y:17},
  {n:33,x:88,y:32},{n:34,x:88,y:38}
];

// DOM referencia
const container = document.getElementById('container');
const spotsDOM = {}; // id -> elem

// DOM létrehozás
function createSpot(n, x, y) {
  const d = document.createElement('div');
  d.className = "spot free";
  d.style.left = x + "%";
  d.style.top = y + "%";

  d.addEventListener("click", () => {
    if (!editMode) return;
    toggleSpot(n);
  });

  container.appendChild(d);
  spotsDOM[n] = d;
}

// Firebase → DOM frissítés
function setVisual(n, state) {
  if (!spotsDOM[n]) return;
  spotsDOM[n].classList.remove("free","occupied");
  spotsDOM[n].classList.add(state);
}

// Foglaltság váltása + mentés Firebase-be
function toggleSpot(n) {
  const ref = db.ref("spots/" + n);
  ref.once("value", snap => {
    const state = snap.val() === "occupied" ? "free" : "occupied";
    ref.set(state);
  });
}

// Indítás – DOM felrakása
baseSpots.forEach(s => createSpot(s.n, s.x, s.y));

// Firebase → Live frissítés minden nézőnek
db.ref("spots").on("value", snapshot => {
  const data = snapshot.val() || {};
  baseSpots.forEach(s => {
    const st = data[s.n] || "free";
    setVisual(s.n, st);
  });
});

// --- LOGIN RÉSZ ---
function openLogin() { document.getElementById('loginBox').style.display='block'; }
function closeLogin() { document.getElementById('loginBox').style.display='none'; }

function login() {
  const u = document.getElementById('user').value;
  const p = document.getElementById('pass').value;

  if (u === "parkrend" && p === "peramefőnök") {
    editMode = true;
    document.getElementById("editStatus").textContent = "Szerkesztési mód (admin)";
    alert("Szerkesztési mód engedélyezve!");
  } else {
    alert("Hibás adatok!");
  }
  closeLogin();
}
</script>

</body>
</html>
